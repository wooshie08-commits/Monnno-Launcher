plugins {
    id 'com.android.application'
}

android {
    namespace 'com.monoos.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.monoos.launcher'
        minSdk 23
        targetSdk 30
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

// No third-party dependencies on purpose: plain framework APIs only.
dependencies {
}
